<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automação Instagram</title><style>body{font:16px system-ui;max-width:720px;margin:48px auto;padding:0 20px;background:#fafafa;color:#18212f}form{display:grid;gap:16px;background:#fff;padding:28px;border-radius:14px;box-shadow:0 2px 18px #0001}label{display:grid;gap:6px;font-weight:650}input,textarea{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px}textarea{min-height:82px}button{background:#4f46e5;color:#fff;border:0;padding:12px;border-radius:8px;font-weight:700}#status{color:#166534}</style><body><h1>Automação de comentários</h1><label>Chave do painel<input id="key" type="password"></label><p>Informe a chave para carregar ou salvar a campanha.</p><form id="form"><label>Palavra-chave<input name="keyword" required></label><label>Link do material<input name="materialUrl" type="url"></label><label>Mensagem<textarea name="openingMessage"></textarea></label><label><input name="enabled" type="checkbox"> Ativar</label><button>Salvar campanha</button><span id="status"></span></form><script>const f=document.querySelector('#form'),s=document.querySelector('#status'),k=document.querySelector('#key'),h=()=>({authorization:'Bearer '+k.value,'content-type':'application/json'});async function load(){const r=await fetch('/api/settings',{headers:h()});if(!r.ok)return;s.textContent='';const x=await r.json();for(const[n,v]of Object.entries(x))if(f[n])f[n].type==='checkbox'?f[n].checked=v:f[n].value=v}k.onchange=load;f.onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f));x.enabled=f.enabled.checked;const r=await fetch('/api/settings',{method:'PUT',headers:h(),body:JSON.stringify(x)});s.textContent=r.ok?'Campanha salva.':'Chave inválida ou erro.'}</script></body></html>
